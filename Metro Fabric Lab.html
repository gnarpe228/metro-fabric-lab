<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Metro Fabric Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap">
<style>
/* Layout: Metro hub. Live 3D stage on the left with an app bar, a scrolling tile panel on the right; stacks on phones. */
:root{
  --bg:#f2f2f2; --surface:#ffffff; --fg:#111111; --muted:#5a5a60; --line:#d4d4d8;
  --stage:#e6e6ea; --grid:#c9c9cf; --bar:#1f1f1f; --bar-fg:#ffffff; --accent:#0050ef;
  --t-cobalt:#0050ef; --t-crimson:#a20025; --t-emerald:#008a00; --t-violet:#6a00ff;
  --t-teal:#00807e; --t-orange:#c94f00; --t-fg:#ffffff;
  --font-display:"Open Sans","Segoe UI Light","Segoe UI",system-ui,sans-serif;
  --font-body:"Open Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#161616; --fg:#ffffff; --muted:#a6a6ad; --line:#333336;
  --stage:#111113; --grid:#2a2a2e; --bar:#1f1f1f; --bar-fg:#ffffff; --accent:#3d85ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#161616; --fg:#ffffff; --muted:#a6a6ad; --line:#333336;
  --stage:#111113; --grid:#2a2a2e; --bar:#1f1f1f; --bar-fg:#ffffff; --accent:#3d85ff; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px}
*{box-sizing:border-box;border-radius:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;flex-direction:column;gap:20px;padding-inline:16px;padding-block:0 24px}
.win{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;display:flex;flex-direction:column;background:var(--stage);height:56vh}
.stage{position:relative;background:var(--stage);flex:1;min-height:0;overflow:hidden;touch-action:none}
.hgrip{flex:none;height:16px;background:var(--bar);cursor:ns-resize;touch-action:none;display:grid;place-items:center}
.hgrip::before{content:"";width:56px;height:4px;background:var(--bar-fg);opacity:.55}
.hgrip:hover::before,.hgrip:focus-visible::before,.hgrip.on::before{opacity:1;background:var(--accent)}
#gl{display:block;width:100%;height:100%;cursor:grab}
#gl.rip,#gl.draw{cursor:crosshair}
#gl.orbit{cursor:move}

.hudio{position:absolute;left:12px;top:12px;display:flex;gap:6px;z-index:2}
.hb{display:flex;align-items:center;gap:8px;background:var(--bar);color:var(--bar-fg);padding:8px 14px;font-size:13px;text-transform:lowercase}
.hudio{align-items:center;flex-wrap:wrap;max-width:calc(100% - 170px)}
.hudmode{font-family:var(--font-display);font-weight:300;font-size:30px;line-height:1;margin-left:8px;pointer-events:none;white-space:nowrap}
.pick{position:relative;cursor:pointer;overflow:hidden}
.fpick{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.pick:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.hb:hover{background:var(--accent)}
.hb:active{transform:scale(.96)}
.hb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hud{position:absolute;left:20px;top:14px;pointer-events:none;max-width:calc(100% - 40px)}
.hud .mode{font-family:var(--font-display);font-weight:300;font-size:44px;line-height:1;letter-spacing:-.01em}
.hud .tip{color:var(--muted);margin-top:6px;font-size:13px}

.appbar{position:absolute;left:0;right:0;bottom:0;background:var(--bar);color:var(--bar-fg);
  display:flex;flex-wrap:nowrap;justify-content:center;gap:4px;padding:10px 8px 8px}
.rb{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1 1 0;min-width:0;max-width:80px;color:var(--bar-fg)}
.rb .ring{width:40px;height:40px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center;transition:background .12s,color .12s}
.rb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rb span{font-size:11px;text-transform:lowercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rb .ring{flex:none}
.rb:hover .ring{background:rgba(255,255,255,.14)}
.rb:active .ring,.rb[aria-pressed="true"] .ring{background:var(--bar-fg);color:var(--bar)}

.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:24px 28px;align-items:start}
.panel>header{grid-column:1/-1;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.panel>.foot{grid-column:1/-1}
.apptitle{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
h1{font-family:var(--font-display);font-weight:300;font-size:52px;line-height:1;margin:4px 0 0;letter-spacing:-.02em}
h2{font-family:var(--font-display);font-weight:300;font-size:24px;margin:0 0 10px;text-transform:lowercase}
section{min-width:0}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;background:var(--c);color:var(--t-fg);aspect-ratio:1/.82;padding:10px 12px;text-align:left;
  display:flex;flex-direction:column;justify-content:space-between;transition:transform .1s;overflow:hidden}
.tile:active{transform:scale(.96) perspective(400px) rotateX(4deg)}
.tile svg{width:38px;height:38px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;align-self:center;margin-top:14px}
.tile .lbl{font-size:13px;text-transform:lowercase;display:flex;justify-content:space-between}
.tile .key{opacity:.7;font-size:11px}
.tile[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:-3px}
.tile[aria-pressed="true"]::after{content:"";position:absolute;right:0;top:0;border-style:solid;border-width:0 30px 30px 0;border-color:transparent var(--fg) transparent transparent}
.tile[aria-pressed="true"]::before{content:"";position:absolute;right:4px;top:5px;width:9px;height:5px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:rotate(-45deg);z-index:1}

.live{grid-column:span 2;aspect-ratio:auto;min-height:110px;background:var(--t-teal);cursor:default}
.inkbar{position:absolute;right:12px;top:12px;display:grid;grid-template-columns:repeat(5,24px);gap:4px;padding:6px;background:var(--bar);z-index:2}
.ink{width:24px;height:24px;background:var(--ink);border:1px solid rgba(255,255,255,.3);padding:0}
.ink[aria-pressed="true"]{outline:2px solid #fff;outline-offset:1px}
.inkbar input[type=color]{width:24px;height:24px;border:1px dashed #fff}
.palette{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.palette .ink{width:auto;height:auto;aspect-ratio:1;border-color:var(--line)}
.palette .ink[aria-pressed="true"]{outline-color:var(--fg)}
.live .nums{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
.live .big{font-family:var(--font-display);font-weight:300;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.live .cap{font-size:11px;text-transform:lowercase;opacity:.85}
.live:active{transform:none}

.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.preset{aspect-ratio:1.4/1;color:#fff;text-align:left;padding:6px 8px;display:flex;align-items:flex-end;font-size:12px;text-transform:lowercase;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.preset[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:-3px}

.io{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.io .tile{aspect-ratio:2.3/1;flex-direction:row;align-items:flex-end;justify-content:space-between}
.io .tile svg{width:28px;height:28px;margin:0;align-self:flex-start}
.io .tile:disabled{opacity:.5;cursor:not-allowed}
.imgchip{display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid var(--fg);padding:6px 6px 6px 10px;margin-bottom:12px;min-width:0}
.imgchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;min-width:0}
.imgchip button{background:var(--fg);color:var(--bg);padding:4px 10px;text-transform:lowercase;flex:none}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:86px;background:var(--bar);color:var(--bar-fg);padding:8px 14px;font-size:13px;z-index:3;max-width:calc(100% - 32px);text-align:center}
.msg{font-size:12px;color:var(--muted);margin:0 0 12px;min-height:1em}
.stage.dropping::after{content:"drop to use as cloth";position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,80,239,.35);color:#fff;font-family:var(--font-display);font-weight:300;font-size:32px;z-index:4;pointer-events:none}
.row{display:grid;gap:6px;margin-bottom:12px}
.row label,.fld{font-size:12px;color:var(--muted);text-transform:lowercase;display:flex;justify-content:space-between}
.row output{color:var(--fg);font-variant-numeric:tabular-nums}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.sw{display:grid;gap:4px}
input[type=color]{-webkit-appearance:none;appearance:none;width:100%;height:44px;border:2px solid var(--line);padding:0;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0}
input[type=color]::-moz-color-swatch{border:0}

.seg{display:flex;border:2px solid var(--fg);margin-bottom:12px}
.seg button{flex:1;padding:7px 0;text-transform:lowercase}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:24px;background:var(--fg);margin-top:-8px;border:0}
input[type=range]::-moz-range-track{height:8px;background:var(--line)}
input[type=range]::-moz-range-progress{height:8px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:12px;height:24px;background:var(--fg);border:0;border-radius:0}

.switch{display:flex;justify-content:space-between;align-items:center;width:100%;padding:6px 0;text-transform:lowercase}
.switch .trk{width:48px;height:22px;border:2px solid var(--fg);position:relative;padding:3px}
.switch .trk::before{content:"";position:absolute;inset:3px;width:0;background:var(--accent);transition:width .15s}
.switch .trk::after{content:"";position:absolute;top:-2px;left:-2px;width:12px;height:22px;background:var(--fg);transition:left .15s}
.switch[aria-checked="true"] .trk::before{width:calc(100% - 6px)}
.switch[aria-checked="true"] .trk::after{left:34px}
.pen{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.pen input[type=color]{width:56px}
.pen .seg{flex:1;margin:0}
.foot{font-size:11px;color:var(--muted);line-height:1.6;padding-bottom:8px}

@media (max-width:820px){
  .hud .mode{font-size:34px}
  h1{font-size:40px}
}

/* top bar of the sim: import, export and the tool name on one line */
.hudio{position:absolute;left:0;right:0;top:0;max-width:none;display:flex;flex-wrap:nowrap;align-items:center;gap:6px;
  padding:6px 10px;background:var(--bar);color:var(--bar-fg);z-index:2}
.hb{flex:none;white-space:nowrap;background:rgba(255,255,255,.1);padding:7px 12px}
.hudmode{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--bar-fg);font-size:22px;margin-left:10px;text-align:right}
.inkbar{top:58px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <div class="win" id="win">
  <section class="stage" id="stage" aria-label="3D fabric">
    <canvas id="gl"></canvas>
    <div class="hudio">
      <label class="hb pick" id="bImport2"><svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 15v5h16v-5"/></svg>import<input type="file" class="fpick" accept="image/*" aria-label="Import an image as the cloth"></label>
      <button class="hb" id="bExport2"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 15v5h16v-5"/></svg>export</button>
      <span class="hudmode" id="hudMode">drag</span>
    </div>
    <div class="toast" id="toast" hidden></div>
    <div class="inkbar" id="inkbar" hidden aria-label="Ink colour"></div>
    <nav class="appbar" aria-label="Fabric actions">
      <button class="rb" id="bPause" aria-pressed="false"><span class="ring" id="pauseIco"></span><span id="pauseLbl">pause</span></button>
      <button class="rb" id="bWind" aria-pressed="false"><span class="ring"><svg viewBox="0 0 24 24"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h16a3 3 0 1 1-3 3"/><path d="M3 16h7"/></svg></span><span>wind</span></button>
      <button class="rb" id="bPins"><span class="ring"><svg viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M8 3h8l-1 6 3 4H6l3-4z"/></svg></span><span id="pinLbl">top edge</span></button>
      <button class="rb" id="bReset"><span class="ring"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg></span><span>new cloth</span></button>
      <button class="rb" id="bClear"><span class="ring"><svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M14 4l6 6-8 8H6v-6z"/></svg></span><span>clear ink</span></button>
    </nav>
  </section>
  <div class="hgrip" id="hgrip" role="separator" aria-orientation="horizontal" aria-label="Resize simulation height" title="Drag to resize" tabindex="0"></div>
  </div>

  <aside class="panel">
    <header>
      <div class="apptitle">Fabric Lab</div>
      <h1>simulate</h1>
    </header>

    <section>
      <h2>tools</h2>
      <div class="tiles" id="tools">
        <button class="tile" data-mode="drag" style="--c:var(--t-cobalt)" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M8 13V5a1.5 1.5 0 0 1 3 0v6"/><path d="M11 11V3.5a1.5 1.5 0 0 1 3 0V11"/><path d="M14 11V5.5a1.5 1.5 0 0 1 3 0V13"/><path d="M17 9.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8L3 15.5a1.6 1.6 0 0 1 2.5-2L8 16"/></svg><span class="lbl">drag <span class="key">1</span></span></button>
        <button class="tile" data-mode="rip" style="--c:var(--t-crimson)" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9"/><path d="M14.5 14.5 20 20"/><path d="M8.1 8.1 12 12"/></svg><span class="lbl">rip <span class="key">2</span></span></button>
        <button class="tile" data-mode="draw" style="--c:var(--t-emerald)" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18z"/><path d="M2 2l7.6 7.6"/><circle cx="11" cy="11" r="2"/></svg><span class="lbl">draw <span class="key">3</span></span></button>
        <button class="tile" data-mode="orbit" style="--c:var(--t-violet)" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10" ry="4.5"/><path d="M19 9.5l2.2-.6-.5 2.3"/></svg><span class="lbl">orbit <span class="key">4</span></span></button>
        <div class="tile live" aria-live="off">
          <div class="nums">
            <div><div class="big" id="sIntact">0</div><div class="cap">threads intact</div></div>
            <div><div class="big" id="sTorn">0</div><div class="cap">torn</div></div>
            <div><div class="big" id="sPct">0%</div><div class="cap">damage</div></div>
            <div><div class="big" id="sInk">0%</div><div class="cap">ink coverage</div></div>
            <div><div class="big" id="sStrokes">0</div><div class="cap">strokes</div></div>
          </div>
          <span class="lbl">weave 48 × 36</span>
        </div>
      </div>
    </section>

    <section>
      <h2>look</h2>
      <div class="io">
        <label class="tile pick" id="bImport" style="--c:var(--t-orange)"><svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 15v5h16v-5"/></svg><span class="lbl">import image</span><input type="file" class="fpick" accept="image/*" aria-label="Import an image as the cloth"></label>
        <button class="tile" id="bExport" style="--c:var(--t-cobalt)"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 15v5h16v-5"/></svg><span class="lbl">export png</span></button>
      </div>
      <div class="imgchip" id="imgChip" hidden><span id="imgName"></span><button id="bImgRemove">remove image</button></div>
      <p class="msg" id="ioMsg" role="status"></p>
      <div class="presets" id="presets"></div>
      <div class="seg" id="gType"><button data-v="linear" aria-pressed="true">linear</button><button data-v="radial" aria-pressed="false">radial</button></div>
      <div class="swatches">
        <div class="sw"><span class="fld">start</span><input type="color" id="c0" aria-label="Gradient start colour"></div>
        <div class="sw"><span class="fld">middle</span><input type="color" id="c1" aria-label="Gradient middle colour"></div>
        <div class="sw"><span class="fld">end</span><input type="color" id="c2" aria-label="Gradient end colour"></div>
      </div>
      <div class="row"><label for="gAngle">angle <output id="oAngle">135°</output></label><input type="range" id="gAngle" min="0" max="360" value="135"></div>
      <div class="row"><label for="gMid">middle stop <output id="oMid">50%</output></label><input type="range" id="gMid" min="5" max="95" value="50"></div>
      <button class="switch" id="weave" role="switch" aria-checked="true">twill weave texture <span class="trk"></span></button>
    </section>

    <section>
      <h2>brush</h2>
      <div class="palette" id="palette" aria-label="Ink colour"></div>
      <div class="pen">
        <input type="color" id="penColor" value="#ffffff" aria-label="Brush colour">
        <div class="seg" id="penMode"><button data-v="ink" aria-pressed="true">ink</button><button data-v="erase" aria-pressed="false">erase</button></div>
      </div>
      <div class="row"><label for="penSize">size <output id="oPen">14 px</output></label><input type="range" id="penSize" min="2" max="60" value="14"></div>
    </section>

    <section>
      <h2>cloth</h2>
      <div class="row"><label for="stiff">stiffness <output id="oStiff">14 passes</output></label><input type="range" id="stiff" min="3" max="30" value="14"></div>
      <div class="row"><label for="windStr">wind <output id="oWind">40%</output></label><input type="range" id="windStr" min="0" max="100" value="40"></div>
      <div class="row"><label for="ripR">rip width <output id="oRip">0.14 m</output></label><input type="range" id="ripR" min="5" max="40" value="14"></div>
      <button class="switch" id="tear" role="switch" aria-checked="false">tear when overstretched <span class="trk"></span></button>
    </section>

    <p class="foot">Keys: 1–4 tools · W wind · P pins · R new cloth. Right-drag orbits in any tool.</p>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const COLS = 48, ROWS = 36, SP = 0.11, TOP = 2.0, FLOOR = -2.35, TEAR = 3.2;
const N = COLS * ROWS;

/* ---------- cloth state ---------- */
const pos = new Float32Array(N * 3), prev = new Float32Array(N * 3), home = new Float32Array(N * 3);
const pinned = new Uint8Array(N);
let cons = [], hIdx, vIdx, dirty = true, total = 0;
let pinMode = 0; const PIN_LABELS = ['top edge', 'corners', 'free fall'];
const handles = new Map(); /* pointerId -> {idx, set, target, plane}; one per finger grabbing the cloth */
const grabbed = new Uint8Array(N);
let wind = false, windStr = .4, iters = 14, tearOn = false, ripR = .14;

function initCloth() {
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    const k = (j * COLS + i) * 3;
    home[k] = (i - (COLS - 1) / 2) * SP; home[k + 1] = TOP - j * SP; home[k + 2] = (Math.random() - .5) * .002;
    pos[k] = prev[k] = home[k]; pos[k + 1] = prev[k + 1] = home[k + 1]; pos[k + 2] = prev[k + 2] = home[k + 2];

  el.addEventListener('input', upd); upd();
}
range('#gAngle', '#oAngle', v => v + '°', v => { look.angle = v; composeQueued = true; });
range('#gMid', '#oMid', v => v + '%', v => { look.mid = v; composeQueued = true; });
range('#penSize', '#oPen', v => v + ' px', v => penSize = v);
range('#stiff', '#oStiff', v => v + ' passes', v => iters = v);
range('#windStr', '#oWind', v => v + '%', v => windStr = v / 100);
range('#ripR', '#oRip', v => (v / 100).toFixed(2) + ' m', v => ripR = v / 100);

function sw(id, fn) { const el = $(id); el.addEventListener('click', () => { const on = el.getAttribute('aria-checked') !== 'true'; el.setAttribute('aria-checked', on); fn(on); }); }
sw('#weave', on => { look.weave = on; composeQueued = true; });
sw('#tear', on => tearOn = on);

function toggleWind() { wind = !wind; $('#bWind').setAttribute('aria-pressed', wind); }
function cyclePins() { pinMode = (pinMode + 1) % 3; applyPins(); }
$('#bWind').addEventListener('click', toggleWind);
$('#bPins').addEventListener('click', cyclePins);
function newCloth() { pinMode = pinMode === 2 ? 0 : pinMode; initCloth(); }
$('#bReset').addEventListener('click', newCloth);
$('#bClear').addEventListener('click', clearInk);

addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input')) return;
  const k = e.key.toLowerCase();
  if (k === ' ' && !e.target.closest('button,[role=separator]')) { e.preventDefault(); setPaused(!paused); return; }
  if (k === '1') setMode('drag'); else if (k === '2') setMode('rip'); else if (k === '3') setMode('draw'); else if (k === '4') setMode('orbit');
  else if (k === 'w') toggleWind(); else if (k === 'p') cyclePins(); else if (k === 'r') newCloth();
});

/* ---------- import / export ---------- */
let toastT = 0;
const ioMsg = t => {
  $('#ioMsg').textContent = t;
  const el = $('#toast'); el.textContent = t; el.hidden = !t;
  clearTimeout(toastT); if (t) toastT = setTimeout(() => { el.hidden = true; }, 3500);
};
function removeImage() { if (!imgLayer) return; imgLayer = null; $('#imgChip').hidden = true; composeQueued = true; }
async function importFile(file) {
  if (!file) return;
  try {
    let src;
    try { src = await createImageBitmap(file); }
    catch (e) { src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
    const c = document.createElement('canvas'); c.width = TW; c.height = TH; const g = c.getContext('2d');
    const sw = src.width, sh = src.height, k = Math.max(TW / sw, TH / sh), w = sw * k, h = sh * k;
    g.imageSmoothingQuality = 'high'; g.drawImage(src, (TW - w) / 2, (TH - h) / 2, w, h);
    imgLayer = c;
    $('#imgName').textContent = file.name || 'pasted image'; $('#imgChip').hidden = false;
    presetBox.querySelectorAll('.preset').forEach(x => x.setAttribute('aria-pressed', false));
    ioMsg('Using ' + (file.name || 'pasted image') + ' as the cloth'); composeQueued = true;
  } catch (e) { ioMsg("That file isn't an image this browser can open. Try a PNG, JPG, WebP or GIF."); }
}
$('#bExport2').addEventListener('click', () => $('#bExport').click());
document.querySelectorAll('.fpick').forEach(inp => inp.addEventListener('change', e => { importFile(e.target.files && e.target.files[0]); e.target.value = ''; }));
$('#bImgRemove').addEventListener('click', removeImage);
stage.addEventListener('dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); stage.classList.add('dropping'); } });
stage.addEventListener('dragleave', () => stage.classList.remove('dropping'));
stage.addEventListener('drop', e => { e.preventDefault(); stage.classList.remove('dropping'); importFile(e.dataTransfer.files[0]); });
addEventListener('paste', e => { const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/')); if (it) importFile(it.getAsFile()); });

const downloadsP = (window.claude && claude.use) ? claude.use('downloads').catch(() => null) : Promise.resolve(null);
$('#bExport').addEventListener('click', async () => {
  compose();
  const blob = await new Promise(r => tc.toBlob(r, 'image/png'));
  const dl = await downloadsP;
  if (!dl || !blob) { ioMsg("Saving files isn't available in this view."); return; }
  try { await dl.save({ filename: 'fabric-cloth.png', data: blob }); ioMsg('Exported fabric-cloth.png'); }
  catch (e) {
    const c = e && e.code;
    ioMsg(c === 'declined' ? 'Export cancelled.' : c === 'rate_limited' ? 'A save prompt is already open.' : c === 'too_large' ? 'The image is too large to save here.' : "Saving files isn't available in this view.");
  }
});

/* ---------- full-bleed header: drag the bar under it to set the height ---------- */
const win = $('#win'), hgrip = $('#hgrip');
let H = 0;
try { H = +localStorage.getItem('fabric-h') || 0; } catch (e) {}
function setH(h) {
  H = Math.round(Math.min(Math.max(h, 180), innerHeight - 60));
  win.style.height = H + 'px';
  try { localStorage.setItem('fabric-h', H); } catch (e) {}
}
setH(H || innerHeight * .56);
let rs = null;
hgrip.addEventListener('pointerdown', e => { hgrip.setPointerCapture(e.pointerId); rs = { y: e.clientY, H }; hgrip.classList.add('on'); });
hgrip.addEventListener('pointermove', e => { if (rs) setH(rs.H + e.clientY - rs.y); });
const endR = () => { rs = null; hgrip.classList.remove('on'); };
hgrip.addEventListener('pointerup', endR); hgrip.addEventListener('pointercancel', endR);
hgrip.addEventListener('dblclick', () => setH(H > innerHeight * .5 ? innerHeight * .34 : innerHeight * .7));
hgrip.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') { setH(H - 24); e.preventDefault(); }
  if (e.key === 'ArrowDown') { setH(H + 24); e.preventDefault(); }
});
addEventListener('resize', () => setH(H));

/* ---------- loop ---------- */
initCloth(); placeCam(); setMode('drag');
let acc = 0, lastT = performance.now();
const DT = 1 / 120;
function frame(now) {
  acc += Math.min(.05, (now - lastT) / 1000); lastT = now;
  let n = 0;
  if (paused) acc = 0;
  while (acc >= DT && n < 4) { step(DT, now / 1000); acc -= DT; n++; }
  if (n === 4) acc = 0;
  if (dirty) { rebuildIndex(); dirty = false; }
  if (composeQueued) { compose(); composeQueued = false; }
  posAttr.needsUpdate = true; geo.computeVertexNormals(); geo.computeBoundingSphere();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

</body></html>
